<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Családi naptár rendelés</title>
    <meta name="description" content="Személyre szabott, nyomtatott 12 oldalas naptár a saját fényképeiddel." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Családi naptár" />
    <meta property="og:title" content="Családi naptár rendelés" />
    <meta property="og:description" content="Személyre szabott, nyomtatott 12 oldalas naptár a saját fényképeiddel." />
    <meta property="og:image" content="https://blaczko.github.io/calendarGenerator/share/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Családi naptár rendelés" />
    <meta name="twitter:description" content="Személyre szabott, nyomtatott 12 oldalas naptár a saját fényképeiddel." />
    <meta name="twitter:image" content="https://blaczko.github.io/calendarGenerator/share/og.jpg" />
    <script src="/config.js"></script>
    <script src="/gas-bridge.js"></script>
    <style>
      :root {
        --ink: #2a241c;
        --muted: #6b6258;
        --line: #e4d8c8;
        --accent: #b4532a;
        --card: #fffaf4;
        --bg: #f7f1e8;
        --nav-h: 0px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(160deg, #f7f1e8, #efe4d6 40%, #f8f3eb);
        color: var(--ink);
      }
      main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
      .hero {
        background: linear-gradient(120deg, #3d2a1f, #8a3c1c 45%, #c47a3a);
        color: #fff8f1;
        border-radius: 24px 24px 0 0;
        padding: 28px 24px;
      }
      .hero h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.2; }
      .hero p { margin: 10px 0 0; opacity: 0.9; }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-top: 0;
        border-radius: 0 0 24px 24px;
        padding: 20px;
        box-shadow: 0 18px 50px rgba(80, 50, 20, 0.08);
      }
      .steps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
      .steps button {
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
      }
      .steps button.active { background: var(--accent); color: #fff; }
      .steps button.done { background: #efe4d6; color: var(--ink); }
      label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 0.95rem; }
      input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        font: inherit;
        background: #fff;
      }
      input[type="checkbox"] {
        width: auto;
        height: auto;
        padding: 0;
        margin: 3px 0 0;
        border-radius: 4px;
        flex: 0 0 auto;
        accent-color: var(--accent);
      }
      .consent {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 16px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        font-weight: 600;
        line-height: 1.35;
        cursor: pointer;
      }
      .consent-text { flex: 1; }
      .consent-note {
        margin: 8px 0 0;
        font-weight: 400;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .hint { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
      .row { display: grid; gap: 12px; }
      @media (min-width: 640px) { .row.two { grid-template-columns: 1fr 1fr; } }
      .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
      }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-secondary { background: #fff; border: 1px solid var(--line); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .error {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        padding: 10px 12px;
        border-radius: 12px;
        margin-bottom: 12px;
        display: none;
      }
      .month {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 12px;
        background: #fff;
      }
      .month-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .drop {
        border: 1px dashed rgba(180, 83, 42, 0.45);
        background: #fff7ef;
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        color: var(--muted);
        cursor: pointer;
      }
      .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
      @media (min-width: 640px) { .thumbs { grid-template-columns: repeat(6, 1fr); } }
      .thumb {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--line);
        aspect-ratio: 1;
        background: #eee;
      }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .thumb button {
        position: absolute; top: 4px; right: 4px;
        border: 0; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff;
        width: 24px; height: 24px; cursor: pointer;
      }
      .thumb.pending img { filter: brightness(0.72); }
      .thumb-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgba(30, 20, 12, 0.28);
        color: #fff;
        font-size: 0.72rem;
        font-weight: 600;
        text-align: center;
        padding: 6px;
      }
      .thumb-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.35);
        border-top-color: #fff;
        animation: thumb-spin 0.8s linear infinite;
      }
      @keyframes thumb-spin { to { transform: rotate(360deg); } }
      .event-row { display: grid; gap: 8px; margin-bottom: 10px; }
      @media (min-width: 640px) {
        .event-row { grid-template-columns: 160px 1fr auto; align-items: center; }
      }
      .summary div { padding: 8px 0; border-bottom: 1px solid var(--line); }
      .ok {
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #065f46;
        padding: 16px;
        border-radius: 16px;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        background: #efe4d6;
        color: var(--ink);
        margin-left: 8px;
      }
      .badge.edit { background: #e7f5ea; color: #2f6b3a; }
      .badge.ro { background: #fde8e4; color: #8a2a1c; }
      .badge.office { background: #e8eef8; color: #1e3a5f; }
      .price-box {
        margin: 18px 0 4px;
        padding: 14px 16px;
        border-radius: 14px;
        background: #f7f1ea;
        border: 1px solid var(--line);
      }
      .price-box .price-label {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0 0 4px;
      }
      .price-box .price-value {
        margin: 0;
        font-size: 1.55rem;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: 0.02em;
      }
      .price-box .price-note {
        margin: 6px 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .field-error {
        border-color: #c62828 !important;
        box-shadow: 0 0 0 2px rgba(198, 40, 40, 0.15);
      }
      .hint.warn { color: #b42318; }
      .office-banner {
        display: none;
        margin: 12px 0 0;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(255,255,255,0.35);
        font-size: 0.85rem;
        font-weight: 600;
      }
      .office-banner.is-visible {
        display: inline-block;
      }
      .google-account-banner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 12px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #d7c4a8;
        background: #fff6e8;
        color: #5a4630;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 0.9rem;
        line-height: 1.35;
      }
      .google-account-banner strong { display: block; margin-bottom: 2px; }
      .google-account-banner button {
        border: 0;
        border-radius: 999px;
        padding: 8px 14px;
        background: #1a73e8;
        color: #fff;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .meta { display: grid; gap: 8px 16px; grid-template-columns: 1fr; margin-top: 12px; }
      @media (min-width: 640px) { .meta { grid-template-columns: 1fr 1fr; } }
      .meta div {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }
      .meta strong { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .preview-wrap {
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
        height: 70vh;
      }
      .preview-wrap img { width: 100%; height: auto; display: block; }
      .preview-wrap iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #f7f1e8;
      }
      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 16px;
        background: #fff;
      }
      .flash-ok {
        display: none;
        margin: 12px 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: #e7f5ea;
        color: #2f6b3a;
      }
      .top-links { margin-top: 16px; font-size: 0.9rem; }
      .top-links a { color: var(--accent); margin-right: 14px; }
      .loading { padding: 40px 10px; text-align: center; color: var(--muted); }
      body.page-lookup main { max-width: 520px; }
      body.page-review main { max-width: 860px; }
      input:disabled, select:disabled, textarea:disabled {
        background: #f3eee6;
        color: var(--muted);
      }
      .busy { opacity: 0.7; pointer-events: none; }
      /* Photo uploads must NOT lock the whole form — only mark the active month */
      .month.uploading {
        outline: 2px solid rgba(180, 83, 42, 0.35);
        outline-offset: 2px;
      }
      .month.uploading .drop::after {
        content: ' Feltöltés folyamatban…';
        display: block;
        margin-top: 6px;
        font-size: 0.8rem;
        color: var(--accent);
      }
      #status {
        display: none;
        margin: 0 0 12px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #fff7ef;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }
      .progress-wrap { margin-top: 10px; }
      .progress-track {
        height: 12px;
        border-radius: 999px;
        background: #e8ddd0;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #b4532a, #c47a3a);
        transition: width 0.25s ease;
      }
      .progress-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        font-size: 0.8rem;
      }
      .progress-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 70%;
      }
      .mobile-only { display: none; }
      .desktop-only { display: block; }
      .step-progress {
        display: none;
        margin-bottom: 16px;
      }
      .step-progress-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 8px;
      }
      .step-progress-label { font-weight: 700; font-size: 1rem; }
      .step-progress-count { color: var(--muted); font-size: 0.85rem; }
      .step-progress-track {
        height: 8px;
        border-radius: 999px;
        background: #e8ddd0;
        overflow: hidden;
      }
      .step-progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--accent);
        transition: width 0.25s ease;
      }
      .photo-actions {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }
      .photo-actions .btn { width: 100%; min-height: 48px; }

      /*
        Mobile layout must NOT depend on CSS viewport width alone:
        Google Apps Script / Messenger iframes often report a “desktop” width
        while the page is visually scaled on a phone.
        body.is-mobile is set from UA + touch in JS.
      */
      html.is-mobile body,
      body.is-mobile {
        /* marker for nested selectors below */
      }
      html.is-mobile main,
      body.is-mobile main {
        max-width: 100%;
        padding: 12px 12px calc(96px + env(safe-area-inset-bottom, 0px));
      }
      html.is-mobile .hero,
      body.is-mobile .hero {
        border-radius: 18px 18px 0 0;
        padding: 18px 16px;
      }
      html.is-mobile .hero h1,
      body.is-mobile .hero h1 { font-size: 1.35rem; }
      html.is-mobile .hero p,
      body.is-mobile .hero p { font-size: 0.92rem; }
      html.is-mobile .panel,
      body.is-mobile .panel {
        border-radius: 0 0 18px 18px;
        padding: 16px 14px 20px;
      }
      html.is-mobile .steps,
      body.is-mobile .steps { display: none !important; }
      html.is-mobile .step-progress,
      body.is-mobile .step-progress { display: block !important; }
      html.is-mobile .mobile-only,
      body.is-mobile .mobile-only { display: block !important; }
      html.is-mobile .desktop-only,
      body.is-mobile .desktop-only { display: none !important; }
      html.is-mobile .row.two,
      body.is-mobile .row.two { grid-template-columns: 1fr !important; }
      html.is-mobile input,
      html.is-mobile select,
      html.is-mobile textarea,
      html.is-mobile .btn,
      body.is-mobile input,
      body.is-mobile select,
      body.is-mobile textarea,
      body.is-mobile .btn {
        font-size: 16px !important; /* prevents iOS focus zoom */
        min-height: 48px;
      }
      html.is-mobile input[type="checkbox"],
      body.is-mobile input[type="checkbox"] {
        min-height: 22px;
        width: 22px;
        height: 22px;
      }
      html.is-mobile .drop,
      body.is-mobile .drop {
        padding: 18px 12px;
        min-height: 72px;
        font-size: 0.95rem;
      }
      html.is-mobile .thumbs,
      body.is-mobile .thumbs { grid-template-columns: repeat(2, 1fr) !important; gap: 10px; }
      html.is-mobile .thumb button,
      body.is-mobile .thumb button { width: 32px; height: 32px; font-size: 18px; }
      html.is-mobile .event-row,
      body.is-mobile .event-row { grid-template-columns: 1fr !important; }
      html.is-mobile .nav,
      body.is-mobile .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        margin: 0;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        background: rgba(255, 250, 244, 0.97);
        border-top: 1px solid var(--line);
        display: grid !important;
        grid-template-columns: 1fr 1.4fr;
        gap: 10px;
      }
      html.is-mobile .nav .btn,
      body.is-mobile .nav .btn { width: 100%; }
      html.is-mobile .month,
      body.is-mobile .month { padding: 14px; }

      /* Narrow real viewports (Safari/Chrome without odd iframe width) */
      @media (max-width: 720px) {
        main { padding: 12px 12px 48px; }
        .row.two { grid-template-columns: 1fr !important; }
        .thumbs { grid-template-columns: repeat(2, 1fr) !important; }
      }
    </style>
    <script>
      /* Early mobile class — Apps Script/Messenger iframes often report desktop width. */
      (function () {
        var ua = navigator.userAgent || '';
        var mobile = /Android|iPhone|iPad|iPod|Mobile|FBAN|FBAV|Instagram/i.test(ua)
          || Math.min(window.innerWidth || 9999, window.innerHeight || 9999) <= 720;
        if (mobile) document.documentElement.classList.add('is-mobile');
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add(mobile ? 'is-mobile' : 'is-desktop');
        });
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="hero">
        <h1>Személyre szabott családi naptár rendelése</h1>
        <p class="desktop-only">Készíts egyedi családi naptárat a kedvenc fényképeiddel és fontos eseményeiddel.</p>
        <p class="mobile-only">5 rövid lépés · fényképek a telefonodról</p>
        <p style="margin:12px 0 0;font-size:0.9rem"><a id="lookupHeroLink" href="?page=lookup" style="color:#fff8f1;text-decoration:underline">Meglévő rendelés megtekintése</a></p>
        <p id="officeBanner" class="office-banner">Irodai megrendelés</p>
      </div>
      <div class="panel" id="app">
        <div class="steps" id="stepNav"></div>
        <div class="step-progress" id="stepProgress" aria-live="polite"></div>
        <div class="error" id="error"></div>
        <div id="status"></div>
        <div id="view"></div>
      </div>
      <div class="nav" id="nav"></div>
    </main>

    <script>
      // Static Cloudflare Pages host — no Apps Script HtmlService templates.
      var CONFIG = {
        page: 'customer',
        orderId: '',
        token: '',
        office: false,
        webAppUrl: (window.APP_CONFIG && window.APP_CONFIG.publicOrigin) || (location.origin || '')
      };
      var WEB_APP_URL = CONFIG.webAppUrl || '';
      var QUERY = {
        page: 'customer',
        orderId: '',
        token: '',
        office: false
      };
      try {
        var sp = new URLSearchParams(location.search || '');
        ['fbclid', 'gclid', 'dclid', 'msclkid', 'twclid', 'mc_cid', 'mc_eid'].forEach(function (k) {
          sp.delete(k);
        });
        Array.prototype.slice.call(sp.keys()).forEach(function (k) {
          if (String(k).toLowerCase().indexOf('utm_') === 0) sp.delete(k);
        });
        if (sp.get('page')) QUERY.page = sp.get('page');
        if (sp.get('orderId')) QUERY.orderId = sp.get('orderId');
        if (sp.get('token')) QUERY.token = sp.get('token');
        var officeOrderParam = (sp.get('officeorder') || '').toLowerCase();
        QUERY.office =
          officeOrderParam === 'true' ||
          officeOrderParam === '1' ||
          officeOrderParam === 'yes';
      } catch (e) {
        QUERY.office = false;
      }
      CONFIG.page = QUERY.page;
      CONFIG.orderId = QUERY.orderId;
      CONFIG.token = QUERY.token;
      CONFIG.office = QUERY.office;
      var PAGE = (QUERY && QUERY.page) || 'customer';
      var DIRECT_FROM_OFFICE = !!(QUERY && QUERY.office);

      function navigateTop(url) {
        try { window.top.location.href = url; }
        catch (e) { location.href = url; }
      }
      function buildCanonicalAppUrl(extraParams) {
        var q = new URLSearchParams();
        var page = (extraParams && extraParams.page) || QUERY.page || 'customer';
        if (page) q.set('page', page);
        var orderId = extraParams && Object.prototype.hasOwnProperty.call(extraParams, 'orderId')
          ? extraParams.orderId
          : QUERY.orderId;
        var token = extraParams && Object.prototype.hasOwnProperty.call(extraParams, 'token')
          ? extraParams.token
          : QUERY.token;
        if (orderId) q.set('orderId', orderId);
        if (token) q.set('token', token);
        if (QUERY.office || (extraParams && extraParams.office)) q.set('officeorder', 'true');
        var qs = q.toString();
        return (location.origin || '') + '/' + (qs ? '?' + qs : '');
      }
      function buildPagesOpenUrl(extraParams) {
        return buildCanonicalAppUrl(extraParams);
      }

      var MONTHS = [
        'Január','Február','Március','Április','Május','Június',
        'Július','Augusztus','Szeptember','Október','November','December'
      ];

      /* -------- Lookup / Review modes (same Customer.html file) -------- */
      if (PAGE === 'lookup' || PAGE === 'review') {
        document.body.classList.add('page-' + PAGE);
        (function bootAltPage() {
          var main = document.querySelector('main');
          if (PAGE === 'lookup') {
            main.innerHTML =
              '<div class="hero"><h1>Rendelés keresése</h1>' +
              '<p>Adja meg a rendelésszámot az áttekintő oldal megnyitásához.</p></div>' +
              '<div class="panel">' +
              '<label for="orderId">Rendelésszám</label>' +
              '<input id="orderId" placeholder="pl. ORD-2027-143052" autocomplete="off" />' +
              '<div class="hint">A számot a megrendelés visszaigazolásán találja.</div>' +
              '<button type="button" class="btn btn-primary" id="openBtn" style="width:100%;margin-top:16px">Áttekintés megnyitása</button>' +
              '<div class="error" id="error"></div>' +
              '<div class="top-links"><a id="newOrderLink" href="?page=customer">Új megrendelés</a></div>' +
              '</div>';

            function showError(msg) {
              var el = document.getElementById('error');
              if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
              el.style.display = 'block';
              el.textContent = msg;
            }
            function openReview() {
              var orderId = (document.getElementById('orderId').value || '').trim();
              if (!orderId) { showError('Adja meg a rendelésszámot.'); return; }
              showError('');
              var btn = document.getElementById('openBtn');
              btn.disabled = true;
              btn.textContent = 'Keresés…';
              google.script.run
                .withSuccessHandler(function () {
                  // Always leave Google multi-login URLs; load via Pages iframe shell.

                  var canvas = document.createElement('canvas');

          events: [],
          photos: []
        },
        done: false,
        /** photoId -> data:image/... preview URL (from local compression) */
        previewById: {},
        /** Local placeholders shown with spinner until Drive upload finishes */
        pendingPhotos: [],
        orderCreating: false,
        orderCreateError: null,
        /** callbacks waiting for editToken */
        orderWaiters: [],
        /** Parallel client-side JPEG compressions (safe — no Apps Script lock) */
        compressConcurrency: 4,
        /** month -> { total, done, label } for multi-month parallel uploads */
        uploadJobs: {},
        activeUploadMonths: 0,
        /** Serialize script.run uploads — parallel batches caused Lock timeout */
        _uploadQueue: [],
        _uploadQueueBusy: false
      };

      function $(id) { return document.getElementById(id); }

      /** Same URL — prefer UA/touch; Apps Script iframes often lie about width. */
      function detectMobile() {
        var ua = navigator.userAgent || '';
        var mobileUa = /Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini|webOS|BlackBerry|FBAN|FBAV|Instagram|Line\//i.test(ua);
        var narrow = false;
        try {
          narrow = window.matchMedia('(max-width: 720px)').matches;
        } catch (e) {}
        var shortSide = Math.min(window.innerWidth || 9999, window.innerHeight || 9999);
        var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        var coarse = false;
        try {
          coarse = window.matchMedia('(pointer: coarse)').matches;
        } catch (e2) {}
        // Messenger / GAS can report a wide iframe on a phone — trust UA first.
        return mobileUa || narrow || shortSide <= 720 || (touch && coarse && shortSide < 1024);
      }

      function applyDeviceMode() {
        var mobile = detectMobile();
        document.body.classList.toggle('is-mobile', mobile);
        document.body.classList.toggle('is-desktop', !mobile);
        state.isMobile = mobile;
      }

      function showError(msg) {
        var el = $('error');
        if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
        el.style.display = 'block';
        el.textContent = msg;
      }

      function setBusy(v) {
        state.busy = v;
        $('app').classList.toggle('busy', v);
        renderNav();
      }

      function setStatus(msg) {
        var el = $('status');
        if (!msg) { el.style.display = 'none'; el.innerHTML = ''; return; }
        el.style.display = 'block';
        el.textContent = msg;
      }

      function showProgress(opts) {
        var el = $('status');
        var pct = Math.max(0, Math.min(100, opts.percent || 0));
        el.style.display = 'block';
        el.innerHTML =
          '<div><strong>' + escapeHtml(opts.title || 'Feltöltés') + '</strong></div>' +
          '<div class="progress-wrap">' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="progress-meta">' +
          '<span class="progress-name">' + escapeHtml(opts.detail || '') + '</span>' +
          '<span>' + escapeHtml(opts.counter || '') + ' · ' + Math.round(pct) + '%</span>' +
          '</div></div>';
      }

      function hideProgress() {
        setStatus('');
      }

      function run(fnName, args, onOk) {
        showError('');
        setBusy(true);
        var runner = google.script.run
          .withSuccessHandler(function (res) {
            setBusy(false);
            setStatus('');
            onOk(res);
          })
          .withFailureHandler(function (err) {
            setBusy(false);
            setStatus('');
            showError(err && err.message ? err.message : String(err));
          });
        // Must call with runner as `this` — apply(null, ...) sends no request.
        runner[fnName].apply(runner, args);
      }

      function notifyOrderWaiters(err, token) {
        var waiters = state.orderWaiters.slice();
        state.orderWaiters = [];
        waiters.forEach(function (w) {
          try { w(err, token); } catch (e) {}
        });
      }

      /** Start Drive order create in background (does not block the photo UI). */
      function startOrderCreationAsync() {
        if (state.editToken || state.orderCreating) return;
        state.orderCreating = true;
        state.orderCreateError = null;
        setStatus('Megrendelés létrehozása a háttérben… Közben már választhat fényképeket.');
        google.script.run
          .withSuccessHandler(function (res) {
            state.orderCreating = false;
            state.editToken = res.editToken;
            state.orderId = res.orderId;
            state.driveFolderUrl = res.driveFolderUrl;
            state.draft.photos = (res.order && res.order.photos) || [];
            setStatus('Megrendelés kész (' + res.orderId + '). Feltöltés folytatódik…');
            notifyOrderWaiters(null, res.editToken);
            setTimeout(function () {
              if (!state.busy) hideProgress();
            }, 800);
          })
          .withFailureHandler(function (err) {
            state.orderCreating = false;
            state.orderCreateError = err && err.message ? err.message : String(err);
            setStatus('');
            showError('Megrendelés létrehozása sikertelen: ' + state.orderCreateError);
            notifyOrderWaiters(state.orderCreateError, null);
          })
          .createOrder({
            fullName: state.draft.fullName,
            phone: state.draft.phone,
            email: state.draft.email,
            calendarYear: state.draft.calendarYear,
            calendarLanguage: state.draft.calendarLanguage,
            calendarFormatPref: state.draft.calendarFormatPref,
            paperSize: state.draft.paperSize || 'A4',
            comments: state.draft.comments,
            privacyConsent: false,
            events: state.draft.events,
            directFromOffice: !!state.directFromOffice
          });
      }

      function whenOrderReady(cb) {
        if (state.editToken) {
          cb(null, state.editToken);
          return;
        }
        if (state.orderCreateError) {
          cb(state.orderCreateError, null);
          return;
        }
        state.orderWaiters.push(cb);
        if (!state.orderCreating) startOrderCreationAsync();
      }

      function ensureOrder(cb) {
        whenOrderReady(function (err, token) {
          if (err) {
            showError(err);
            return;
          }
          cb(token);
        });
      }

      /** Same rules as Code.gs isRomanianPhone_ */
      function isRomanianPhone(raw) {
        var cleaned = String(raw || '').replace(/[\s\-().]/g, '');
        return (
          /^\+40[237]\d{8}$/.test(cleaned) ||
          /^0040[237]\d{8}$/.test(cleaned) ||
          /^0[237]\d{8}$/.test(cleaned)
        );
      }

      function canNext() {
        if (state.step === 0) {
          return !!(state.draft.fullName.trim() && isRomanianPhone(state.draft.phone));
        }
        if (state.step === 1) return !!(state.draft.calendarYear && state.draft.calendarFormatPref && state.draft.paperSize);
        if (state.step === 4) return !!state.draft.privacyConsent;
        return true;
      }

      function collectDraftEvents() {
        var events = [];
        var list = state.draft.events || [];
        for (var i = 0; i < list.length; i++) {
          var date = list[i].eventDate;
          var desc = String(list[i].description || '').trim();
          if (date && desc) events.push({ eventDate: date, description: desc });
        }
        return events;
      }

      function goNext() {
        if (!canNext()) {
          if (state.step === 0 && state.draft.fullName.trim() && !isRomanianPhone(state.draft.phone)) {
            showError('Érvényes román telefonszám szükséges (pl. +40 712 345 678 vagy 0712 345 678).');
          } else {
            showError('Kérjük, töltse ki a kötelező mezőket.');
          }
          return;
        }
        // Enter photo step immediately; create order asynchronously in background.
        if (state.step === 1) {
          state.step = 2;
          render();
          startOrderCreationAsync();
          return;
        }
        // Persist events as soon as the customer leaves that step (before finalize),
        // so Drive sync / desktop import already sees them.
        if (state.step === 3) {
          ensureOrder(function (token) {
            var events = collectDraftEvents();
            state.draft.events = events;
            setStatus('Események mentése…');
            run('updateOrder', [token, { events: events }], function () {
              setStatus('');
              state.step = 4;
              render();
            });
          });
          return;
        }
        if (state.step === 4) {
          finalize();
          return;
        }
        state.step += 1;
        render();
      }

      function goBack() {
        if (state.step > 0) {
          state.step -= 1;
          render();
        }
      }

      function finalize() {
        ensureOrder(function (token) {
          var events = collectDraftEvents();
          state.draft.events = events;
          setStatus('Véglegesítés…');
          run('finalizeOrder', [token, {
            fullName: state.draft.fullName,
            phone: state.draft.phone,
            email: state.draft.email,
            calendarYear: state.draft.calendarYear,
            calendarFormatPref: state.draft.calendarFormatPref,
            paperSize: state.draft.paperSize || 'A4',
            comments: state.draft.comments,
            events: events,
            privacyConsent: true
          }], function (res) {
            state.done = true;
            state.draft.photos = res.order.photos || [];
            if (res.order && res.order.events) state.draft.events = res.order.events;
            render();
          });
        });
      }

      function photosForMonth(m) {
        return (state.draft.photos || []).filter(function (p) { return p.month === m; });
      }

      function pendingForMonth(m) {
        return (state.pendingPhotos || []).filter(function (p) { return p.month === m; });
      }

      function makePendingId() {
        return 'pending-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
      }

      function addPendingFromFiles(month, files) {
        if (!state.pendingPhotos) state.pendingPhotos = [];
        return files.map(function (file) {
          var previewUrl = '';
          try { previewUrl = URL.createObjectURL(file); } catch (e) {}
          var item = {
            id: makePendingId(),
            month: month,
            name: String(file.name || 'photo.jpg'),
            previewUrl: previewUrl,
            phase: 'compressing'
          };
          state.pendingPhotos.push(item);
          return item;
        });
      }

      function setPendingPreview(pendingId, previewUrl) {
        for (var i = 0; i < (state.pendingPhotos || []).length; i++) {
          var p = state.pendingPhotos[i];
          if (p.id !== pendingId) continue;
          if (p.previewUrl && p.previewUrl.indexOf('blob:') === 0 && p.previewUrl !== previewUrl) {
            try { URL.revokeObjectURL(p.previewUrl); } catch (e) {}
          }
          p.previewUrl = previewUrl;
          return;
        }
      }

      function setPendingPhase(pendingIds, phase) {
        var set = {};
        (pendingIds || []).forEach(function (id) { set[id] = true; });
        (state.pendingPhotos || []).forEach(function (p) {
          if (set[p.id]) p.phase = phase;
        });
      }

      function clearPending(pendingIds) {
        var set = {};
        (pendingIds || []).forEach(function (id) { set[id] = true; });
        state.pendingPhotos = (state.pendingPhotos || []).filter(function (p) {
          if (!set[p.id]) return true;
          if (p.previewUrl && p.previewUrl.indexOf('blob:') === 0) {
            try { URL.revokeObjectURL(p.previewUrl); } catch (e) {}
          }
          return false;
        });
      }

      function pendingThumbHtml(p) {
        var img = p.previewUrl
          ? '<img src="' + escapeAttr(p.previewUrl) + '" alt="' + escapeAttr(p.name || '') + '" />'
          : '';
        var label = p.phase === 'uploading' ? 'Feltöltés…' : 'Előkészítés…';
        return '<div class="thumb pending" data-pending="' + escapeAttr(p.id) + '">' +
          img +
          '<div class="thumb-overlay"><div class="thumb-spinner" aria-hidden="true"></div><span>' +
          label + '</span></div></div>';
      }

      /** Resize/compress in the browser so Drive uploads stay small and fast. */
      function compressFile(file) {
        return new Promise(function (resolve, reject) {
          var maxSide = 1600;
          var quality = 0.82;
          var url = URL.createObjectURL(file);
          var img = new Image();
          img.onload = function () {
            try {
              var w = img.width;
              var h = img.height;
              if (w > maxSide || h > maxSide) {
                if (w >= h) {
                  h = Math.round(h * maxSide / w);
                  w = maxSide;
                } else {
                  w = Math.round(w * maxSide / h);
                  h = maxSide;
                }
              }
              var canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              URL.revokeObjectURL(url);
              var dataUrl = canvas.toDataURL('image/jpeg', quality);
              resolve({
                name: String(file.name || 'photo.jpg').replace(/\.\w+$/, '.jpg'),
                mimeType: 'image/jpeg',
                dataBase64: String(dataUrl).split(',')[1] || ''
              });
            } catch (err) {
              URL.revokeObjectURL(url);
              reject(err);
            }
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error('Kép betöltése sikertelen: ' + file.name));
          };
          img.src = url;
        });
      }

      function onPickFiles(month, input) {
        var files = input.files;
        if (!files || !files.length) return;
        var remaining = state.maxPhotos - photosForMonth(month).length - pendingCountForMonth(month);
        if (remaining <= 0) {
          showError('Ebben a hónapban már ' + state.maxPhotos + ' fénykép van.');
          input.value = '';
          return;
        }
        var selected = Array.prototype.slice.call(files, 0, remaining);
        input.value = '';
        // Compress immediately while order may still be creating; upload when token is ready.
        prepareAndUpload(month, selected);
      }

      function pendingCountForMonth(month) {
        return (state._inflightByMonth && state._inflightByMonth[month]) || 0;
      }

      function markMonthUploading(month, on) {
        var blocks = document.querySelectorAll('.month');
        var block = blocks[month - 1];
        if (block) block.classList.toggle('uploading', !!on);
      }

      function refreshUploadProgressUi() {
        var jobs = state.uploadJobs || {};
        var keys = Object.keys(jobs);
        if (!keys.length) {
          hideProgress();
          return;
        }
        var total = 0;
        var done = 0;
        var details = [];
        keys.forEach(function (k) {
          var j = jobs[k];
          total += j.total;
          done += j.done;
          details.push(MONTHS[Number(k) - 1] + ': ' + j.done + '/' + j.total + (j.label ? ' (' + j.label + ')' : ''));
        });
        showProgress({
          title: keys.length > 1
            ? 'Több hónap feltöltése párhuzamosan…'
            : ('Feltöltés: ' + MONTHS[Number(keys[0]) - 1]),
          detail: details.join(' · '),
          counter: done + ' / ' + total,
          percent: total ? (done / total) * 100 : 0
        });
      }

      /** Run async tasks with a concurrency limit; preserves result order. */
      function mapPool(items, limit, worker) {
        var results = new Array(items.length);
        var next = 0;
        var active = 0;
        return new Promise(function (resolve, reject) {
          function launch() {
            while (active < limit && next < items.length) {
              (function (index) {
                active++;
                next++;
                Promise.resolve()
                  .then(function () { return worker(items[index], index); })
                  .then(function (value) {
                    results[index] = value;
                    active--;
                    if (next >= items.length && active === 0) resolve(results);
                    else launch();
                  })
                  .catch(reject);
              })(next);
            }
            if (items.length === 0) resolve(results);
          }
          launch();
        });
      }

      function prepareAndUpload(month, files) {
        showError('');
        // Do NOT lock the whole page — other months stay selectable.
        if (!state._inflightByMonth) state._inflightByMonth = {};
        if (!state.uploadJobs) state.uploadJobs = {};
        state._inflightByMonth[month] = (state._inflightByMonth[month] || 0) + files.length;
        state.activeUploadMonths = (state.activeUploadMonths || 0) + 1;
        markMonthUploading(month, true);

        var pendingItems = addPendingFromFiles(month, files);
        var pendingIds = pendingItems.map(function (p) { return p.id; });
        refreshMonthThumbsOnly(month);

        var total = files.length;
        var compressed = 0;
        var compressLimit = state.compressConcurrency || 4;
        state.uploadJobs[month] = {
          total: total,
          done: 0,
          label: 'tömörítés',
          phase: 'compress',
          pendingIds: pendingIds
        };
        refreshUploadProgressUi();

        mapPool(files, compressLimit, function (file, index) {
          return compressFile(file).then(function (payload) {
            compressed++;
            var pending = pendingItems[index];
            if (pending) {
              setPendingPreview(pending.id, 'data:image/jpeg;base64,' + payload.dataBase64);
              payload._pendingId = pending.id;
            }
            if (state.uploadJobs[month]) {
              state.uploadJobs[month].label = payload.name;
              state.uploadJobs[month].done = compressed * 0.45;
              state.uploadJobs[month].total = total;
            }
            refreshMonthThumbsOnly(month);
            refreshUploadProgressUiSoft(month, compressed, total, payload.name, true);
            return payload;
          });
        })
          .then(function (payloads) {
            setPendingPhase(pendingIds, 'uploading');
            refreshMonthThumbsOnly(month);
            if (state.uploadJobs[month]) {
              state.uploadJobs[month].label = 'várakozás a megrendelésre…';
              state.uploadJobs[month].done = 0;
              state.uploadJobs[month].phase = 'wait';
              state.uploadJobs[month].pendingIds = pendingIds;
            }
            refreshUploadProgressUi();
            whenOrderReady(function (err, token) {
              if (err) {
                failMonthUpload(month, files.length, err);
                return;
              }
              uploadParallel(token, month, payloads, pendingIds);
            });
          })
          .catch(function (err) {
            failMonthUpload(month, files.length, err && err.message ? err.message : String(err));
          });
      }

      function refreshUploadProgressUiSoft(month, compressed, total, name, isCompress) {
        // Keep multi-month summary accurate while one month is still compressing
        var jobs = state.uploadJobs || {};
        var parts = [];
        Object.keys(jobs).forEach(function (k) {
          var j = jobs[k];
          if (Number(k) === month && isCompress) {
            parts.push(MONTHS[month - 1] + ': tömörítés ' + compressed + '/' + total);
          } else if (j.phase === 'upload') {
            parts.push(MONTHS[Number(k) - 1] + ': ' + Math.floor(j.done) + '/' + j.total);
          } else {
            parts.push(MONTHS[Number(k) - 1] + ': ' + (j.label || j.phase || '…'));
          }
        });
        var uploadDone = 0;
        var uploadTotal = 0;
        Object.keys(jobs).forEach(function (k) {
          var j = jobs[k];
          if (j.phase === 'upload') {
            uploadDone += j.done;
            uploadTotal += j.total;
          } else if (Number(k) === month && isCompress) {
            uploadDone += compressed * 0.4;
            uploadTotal += total;
          } else {
            uploadTotal += j.total;
          }
        });
        showProgress({
          title: Object.keys(jobs).length > 1 ? 'Párhuzamos hónapok…' : (isCompress ? 'Tömörítés…' : 'Feltöltés…'),
          detail: parts.join(' · ') + (name ? '' : ''),
          counter: Math.floor(uploadDone) + ' / ' + Math.max(1, Math.floor(uploadTotal)),
          percent: uploadTotal ? Math.min(99, (uploadDone / uploadTotal) * 100) : 0
        });
      }

      function failMonthUpload(month, count, msg) {
        var pendingIds = (state.uploadJobs[month] && state.uploadJobs[month].pendingIds) || [];
        clearPending(pendingIds);
        state._inflightByMonth[month] = Math.max(0, (state._inflightByMonth[month] || 0) - count);
        delete state.uploadJobs[month];
        state.activeUploadMonths = Math.max(0, (state.activeUploadMonths || 0) - 1);
        markMonthUploading(month, false);
        refreshMonthThumbsOnly(month);
        if (state.activeUploadMonths === 0) hideProgress();
        else refreshUploadProgressUi();
        showError(msg);
      }

      /** One Apps Script upload at a time (shared script lock); compress stays parallel. */
      function enqueueUpload(job) {
        if (!state._uploadQueue) state._uploadQueue = [];
        state._uploadQueue.push(job);
        pumpUploadQueue();
      }

      function pumpUploadQueue() {
        if (state._uploadQueueBusy) return;
        var next = (state._uploadQueue || []).shift();
        if (!next) return;
        state._uploadQueueBusy = true;
        next(function () {
          state._uploadQueueBusy = false;
          pumpUploadQueue();
        });
      }

      function uploadParallel(token, month, payloads, pendingIds) {
        var total = payloads.length;
        var previewByName = {};
        payloads.forEach(function (p) {
          previewByName[p.name] = 'data:image/jpeg;base64,' + p.dataBase64;
        });
        pendingIds = pendingIds || (state.uploadJobs[month] && state.uploadJobs[month].pendingIds) || [];
        setPendingPhase(pendingIds, 'uploading');
        refreshMonthThumbsOnly(month);

        state.uploadJobs[month] = {
          total: total,
          done: 0,
          label: 'sorban…',
          phase: 'upload',
          pendingIds: pendingIds
        };
        refreshUploadProgressUi();

        enqueueUpload(function (done) {
          if (state.uploadJobs[month]) {
            state.uploadJobs[month].label =
              total === 1 ? payloads[0].name : (total + ' fénykép egyben');
            state.uploadJobs[month].pendingIds = pendingIds;
          }
          refreshUploadProgressUi();

          var beforeIds = {};
          (state.draft.photos || []).forEach(function (p) { beforeIds[p.id] = true; });

          google.script.run
            .withSuccessHandler(function (res) {
              state.draft.photos = res.order.photos || [];
              (state.draft.photos || []).forEach(function (p) {
                if (beforeIds[p.id]) return;
                if (previewByName[p.originalFilename] && !state.previewById[p.id]) {
                  state.previewById[p.id] = previewByName[p.originalFilename];
                }
              });
              clearPending(pendingIds);
              state._inflightByMonth[month] = Math.max(0, (state._inflightByMonth[month] || 0) - total);
              delete state.uploadJobs[month];
              state.activeUploadMonths = Math.max(0, (state.activeUploadMonths || 0) - 1);
              markMonthUploading(month, false);
              refreshMonthThumbsOnly(month);
              if (state.activeUploadMonths === 0) hideProgress();
              else refreshUploadProgressUi();
              done();
            })
            .withFailureHandler(function (err) {
              failMonthUpload(month, total, err && err.message ? err.message : String(err));
              done();
            })
            .uploadPhotosBatch(token, month, payloads);
        });
      }

      function refreshMonthThumbsOnly(month) {
        var monthBlocks = document.querySelectorAll('.month');
        if (!monthBlocks || !monthBlocks.length) {
          render();
          return;
        }
        var block = monthBlocks[month - 1];
        if (!block) {
          render();
          return;
        }
        var list = photosForMonth(month);
        var pending = pendingForMonth(month);
        var shown = list.length + pending.length;
        var head = block.querySelector('.month-head span');
        if (head) head.textContent = shown + ' / ' + state.maxPhotos;
        var thumbs = block.querySelector('.thumbs');
        if (thumbs) {
          thumbs.innerHTML =
            list.map(function (p) { return thumbHtml(p); }).join('') +
            pending.map(function (p) { return pendingThumbHtml(p); }).join('');
          var dels = thumbs.querySelectorAll('[data-del]');
          for (var j = 0; j < dels.length; j++) {
            dels[j].onclick = function () { removePhoto(this.getAttribute('data-del')); };
          }
        }
      }

      function removePhoto(photoId) {
        if (!state.editToken) return;
        setStatus('Fénykép törlése…');
        run('deletePhoto', [state.editToken, photoId], function (res) {
          delete state.previewById[photoId];
          state.draft.photos = res.order.photos || [];
          render();
        });
      }

      function thumbHtml(photo) {
        var src = state.previewById[photo.id];
        var inner = src
          ? '<img src="' + src + '" alt="' + escapeAttr(photo.originalFilename || 'előnézet') + '" />'
          : '<div style="padding:18px 4px;text-align:center;font-size:10px;word-break:break-all;color:#666">' +
            escapeHtml(photo.originalFilename || 'kép') + '</div>';
        return '<div class="thumb">' + inner +
          '<button type="button" data-del="' + escapeAttr(photo.id) + '" title="Törlés">×</button></div>';
      }

      function renderStepNav() {
        var html = '';
        for (var i = 0; i < STEPS.length; i++) {
          var cls = i === state.step ? 'active' : (i < state.step ? 'done' : '');
          html += '<button type="button" class="' + cls + '" data-step="' + i + '">' + (i + 1) + '. ' + STEPS[i] + '</button>';
        }
        $('stepNav').innerHTML = html;
        var buttons = $('stepNav').querySelectorAll('button');
        for (var b = 0; b < buttons.length; b++) {
          buttons[b].onclick = function () {
            var s = Number(this.getAttribute('data-step'));
            if (s <= state.step || state.editToken) {
              state.step = s;
              render();
            }
          };
        }

        // Compact mobile progress (same step data, friendlier on phone)
        var prog = $('stepProgress');
        if (prog) {
          var pct = ((state.step + (state.done ? 1 : 0)) / STEPS.length) * 100;
          prog.innerHTML =
            '<div class="step-progress-top">' +
            '<div class="step-progress-label">' + escapeHtml(STEPS[Math.min(state.step, STEPS.length - 1)]) + '</div>' +
            '<div class="step-progress-count">' + (state.step + 1) + ' / ' + STEPS.length + '</div>' +
            '</div>' +
            '<div class="step-progress-track"><div class="step-progress-fill" style="width:' + pct + '%"></div></div>';
        }
      }

      function renderNav() {
        if (state.done) {
          $('nav').innerHTML = '';
          return;
        }
        var nextLabel = state.step === 4 ? 'Megrendelés küldése' : 'Tovább';
        $('nav').innerHTML =
          '<button type="button" class="btn btn-secondary" id="backBtn"' + (state.step === 0 || state.busy ? ' disabled' : '') + '>Vissza</button>' +
          '<button type="button" class="btn btn-primary" id="nextBtn"' + (state.busy || !canNext() ? ' disabled' : '') + '>' + nextLabel + '</button>';
        var back = $('backBtn');
        var next = $('nextBtn');
        if (back) back.onclick = goBack;
        if (next) next.onclick = goNext;
      }

      function render() {
        showError('');
        renderStepNav();
        if (state.done) {
          var reviewHref = (WEB_APP_URL || '') + '?page=review&token=' + encodeURIComponent(state.editToken || '') +
            '&orderId=' + encodeURIComponent(state.orderId || '');
          if (!WEB_APP_URL) {
            reviewHref = '?page=review&token=' + encodeURIComponent(state.editToken || '') +
              '&orderId=' + encodeURIComponent(state.orderId || '');
          }
          $('view').innerHTML =
            '<div class="ok">' +
            '<h2>Köszönjük! Megrendelés rögzítve.</h2>' +
            '<p><strong>Rendelés azonosító:</strong> ' + escapeHtml(state.orderId) +
            (state.directFromOffice ? ' <span class="badge office">Irodai</span>' : '') + '</p>' +
            '<p>Amíg a státusz <strong>NEW</strong>, a fényképeket és az adatokat az áttekintő oldalon módosíthatja.</p>' +
            '<p style="margin-top:16px"><a class="btn btn-primary" style="display:inline-block;text-decoration:none" href="' +
            escapeAttr(reviewHref) + '">Rendelés áttekintése / szerkesztése</a></p>' +
            '<p class="hint" style="margin-top:16px">Később a rendelésszámmal is megnyitható: <a href="?page=lookup">Rendelés keresése</a></p>' +
            '</div>';
          renderNav();
          return;
        }

        var d = state.draft;
        var html = '';
        if (state.step === 0) {
          html =
            '<div class="row two">' +
            '<div><label>Teljes név *</label><input id="fullName" value="' + escapeAttr(d.fullName) + '" /></div>' +
            '<div><label>Telefonszám (România) *</label><input id="phone" value="' + escapeAttr(d.phone) + '" placeholder="+40 712 345 678" inputmode="tel" autocomplete="tel" />' +
            '<div id="phoneHint" class="hint">Csak román szám: +40… vagy 07… / 02… / 03…</div></div>' +
            '<div><label>E-mail (opcionális)</label><input id="email" type="email" value="' + escapeAttr(d.email) + '" /></div>' +
            '<div><label>Megjegyzés</label><textarea id="comments" rows="3">' + escapeHtml(d.comments) + '</textarea></div>' +
            '</div>';
        } else if (state.step === 1) {
          html =
            '<label>Naptár év *</label><select id="year">' +
            [2026,2027,2028,2029].map(function (y) {
              return '<option value="' + y + '"' + (d.calendarYear === y ? ' selected' : '') + '>' + y + '</option>';
            }).join('') + '</select>' +
            '<label>Nyelv</label><select id="lang"><option value="hu">Magyar</option></select>' +
            '<label>Papírméret *</label><select id="paperSize">' +
            '<option value="A4"' + ((d.paperSize || 'A4') === 'A4' ? ' selected' : '') + '>A4</option>' +
            '<option value="A3"' + (d.paperSize === 'A3' ? ' selected' : '') + '>A3</option>' +
            '</select>' +
            '<label>Orientáció *</label><select id="format">' +
            '<option value="portrait"' + (d.calendarFormatPref === 'portrait' ? ' selected' : '') + '>Álló (portrait)</option>' +
            '<option value="landscape"' + (d.calendarFormatPref === 'landscape' ? ' selected' : '') + '>Fekvő (landscape)</option>' +
            '</select>' +
            '<div class="price-box" aria-live="polite">' +
            '<p class="price-label">Ár a jelenlegi beállításokkal</p>' +
            '<p class="price-value">' + CALENDAR_PRICE_RON + ' RON</p>' +
            '<p class="price-note">12 oldalas nyomtatott naptár · ' + (d.paperSize === 'A3' ? 'A3' : 'A4') + ' · álló vagy fekvő</p>' +
            '</div>';
        } else if (state.step === 2) {
          html = state.isMobile
            ? '<p class="hint">Havonként 1–' + state.maxPhotos + ' fénykép. Koppints a kamerára vagy a galériára.</p>'
            : '<p class="hint">Havonként 1–' + state.maxPhotos + ' fénykép (JPG/PNG/WebP). Nem kötelező minden hónap.</p>';
          for (var m = 1; m <= 12; m++) {
            var list = photosForMonth(m);
            var pending = pendingForMonth(m);
            var shown = list.length + pending.length;
            var remaining = Math.max(0, state.maxPhotos - shown);
            var disabled = remaining <= 0 ? ' disabled' : '';
            html += '<div class="month"><div class="month-head"><strong>' + MONTHS[m - 1] + '</strong><span>' + shown + ' / ' + state.maxPhotos + '</span></div>';
            if (state.isMobile) {
              html +=
                '<div class="photo-actions">' +
                '<button type="button" class="btn btn-primary" data-pick="gallery" data-month="' + m + '"' + disabled + '>Galéria (max ' + Math.max(1, remaining) + ')</button>' +
                '<button type="button" class="btn btn-secondary" data-pick="camera" data-month="' + m + '"' + disabled + '>Kamera</button>' +
                '<input type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:none" data-month="' + m + '" data-mode="gallery"' + disabled + ' />' +
                '<input type="file" accept="image/*" capture="environment" style="display:none" data-month="' + m + '" data-mode="camera"' + disabled + ' />' +
                '</div>';
            } else {
              html += '<label class="drop">Húzza ide vagy válasszon 1–' + Math.max(1, remaining) + ' fényképet' +
                '<input type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:none" data-month="' + m + '"' +
                disabled + ' /></label>';
            }
            html += '<div class="thumbs">';
            for (var p = 0; p < list.length; p++) {
              html += thumbHtml(list[p]);
            }
            for (var q = 0; q < pending.length; q++) {
              html += pendingThumbHtml(pending[q]);
            }
            html += '</div></div>';
          }
        } else if (state.step === 3) {
          html = '<button type="button" class="btn btn-secondary" id="addEvent">Esemény hozzáadása</button><div id="events"></div>';
        } else if (state.step === 4) {
          html =
            '<div class="summary">' +
            '<div><strong>Név:</strong> ' + escapeHtml(d.fullName) + '</div>' +
            '<div><strong>Telefon:</strong> ' + escapeHtml(d.phone) + '</div>' +
            '<div><strong>Év:</strong> ' + escapeHtml(String(d.calendarYear)) + '</div>' +
            '<div><strong>Papírméret:</strong> ' + escapeHtml(d.paperSize === 'A3' ? 'A3' : 'A4') + '</div>' +
            '<div><strong>Orientáció:</strong> ' + (d.calendarFormatPref === 'landscape' ? 'Fekvő (landscape)' : 'Álló (portrait)') + '</div>' +
            '<div><strong>Fényképek:</strong> ' + (d.photos || []).length + '</div>' +
            '<div class="thumbs" style="margin-top:10px">' +
            (d.photos || []).map(function (ph) { return thumbHtml(ph); }).join('') +
            '</div>' +
            '<div><strong>Események:</strong> ' + (d.events || []).length + '</div>' +
            '<div><strong>Ár:</strong> ' + CALENDAR_PRICE_RON + ' RON</div>' +
            (state.directFromOffice ? '<div><strong>Forrás:</strong> Irodai megrendelés</div>' : '') +
            '</div>' +
            '<label class="consent" for="consent">' +
            '<input id="consent" type="checkbox"' + (d.privacyConsent ? ' checked' : '') + ' />' +
            '<span class="consent-text">Elfogadom az adatkezelési tájékoztatót *' +
            '<p class="consent-note">A megadott adatokat és fényképeket csak a naptár elkészítéséhez használjuk.</p>' +
            '</span></label>';
        }
        $('view').innerHTML = html;
        bindStepHandlers();
        renderNav();
        // Restore uploading markers after re-render so other months stay usable
        Object.keys(state.uploadJobs || {}).forEach(function (k) {
          markMonthUploading(Number(k), true);
        });
        if (state.activeUploadMonths > 0) refreshUploadProgressUi();
      }

      function bindStepHandlers() {
        var d = state.draft;
        function bind(id, key, isNum) {
          var el = $(id);
          if (!el) return;
          el.oninput = el.onchange = function () {
            d[key] = isNum ? Number(el.value) : el.value;
            renderNav();
          };
        }
        bind('fullName', 'fullName');
        bind('email', 'email');
        bind('comments', 'comments');
        bind('year', 'calendarYear', true);
        bind('paperSize', 'paperSize');
        bind('format', 'calendarFormatPref');
        var paperEl = $('paperSize');
        if (paperEl) {
          paperEl.onchange = function () {
            d.paperSize = paperEl.value;
            var note = document.querySelector('.price-note');
            if (note) {
              note.textContent = '12 oldalas nyomtatott naptár · ' +
                (d.paperSize === 'A3' ? 'A3' : 'A4') + ' · álló vagy fekvő';
            }
            renderNav();
          };
        }
        var phoneEl = $('phone');
        if (phoneEl) {
          function refreshPhoneValidity() {
            d.phone = phoneEl.value;
            var hasValue = !!(d.phone || '').trim();
            var ok = isRomanianPhone(d.phone);
            phoneEl.classList.toggle('field-error', hasValue && !ok);
            var hint = $('phoneHint');
            if (hint) {
              hint.classList.toggle('warn', hasValue && !ok);
              hint.textContent = hasValue && !ok
                ? 'Érvénytelen szám. Használjon pl. +40 712 345 678 vagy 0712 345 678 formátumot.'
                : 'Csak román szám: +40… vagy 07… / 02… / 03…';
            }
            renderNav();
          }
          phoneEl.oninput = phoneEl.onchange = refreshPhoneValidity;
          refreshPhoneValidity();
        }
        var consent = $('consent');
        if (consent) {
          consent.onchange = function () {
            d.privacyConsent = consent.checked;
            renderNav();
          };
        }

        var fileInputs = document.querySelectorAll('input[type=file][data-month]');
        for (var i = 0; i < fileInputs.length; i++) {
          fileInputs[i].onchange = function () {
            onPickFiles(Number(this.getAttribute('data-month')), this);
          };
          thisLabelClick(fileInputs[i]);
        }
        var pickBtns = document.querySelectorAll('[data-pick]');
        for (var pb = 0; pb < pickBtns.length; pb++) {
          pickBtns[pb].onclick = function () {
            var month = this.getAttribute('data-month');
            var mode = this.getAttribute('data-pick');
            var input = document.querySelector(
              'input[type=file][data-month="' + month + '"][data-mode="' + mode + '"]'
            );
            if (input && !input.disabled) input.click();
          };
        }
        var dels = document.querySelectorAll('[data-del]');
        for (var j = 0; j < dels.length; j++) {
          dels[j].onclick = function () { removePhoto(this.getAttribute('data-del')); };
        }

        var addEvent = $('addEvent');
        if (addEvent) {
          addEvent.onclick = function () {
            d.events.push({ eventDate: d.calendarYear + '-01-01', description: '' });
            renderEvents();
          };
          renderEvents();
        }
      }

      function thisLabelClick(input) {
        var label = input.parentNode;
        if (label && label.classList.contains('drop')) {
          label.onclick = function (e) {
            if (e.target === input) return;
            input.click();
          };
        }
      }

      function renderEvents() {
        var box = $('events');
        if (!box) return;
        var html = '';
        for (var i = 0; i < state.draft.events.length; i++) {
          var ev = state.draft.events[i];
          html += '<div class="event-row">' +
            '<input type="date" data-ev="date" data-i="' + i + '" value="' + escapeAttr(ev.eventDate) + '" />' +
            '<input data-ev="desc" data-i="' + i + '" placeholder="pl. Születésnap" value="' + escapeAttr(ev.description) + '" />' +
            '<button type="button" class="btn btn-secondary" data-ev-del="' + i + '">Törlés</button></div>';
        }
        box.innerHTML = html;
        var inputs = box.querySelectorAll('[data-ev]');
        for (var k = 0; k < inputs.length; k++) {
          inputs[k].oninput = function () {
            var i = Number(this.getAttribute('data-i'));
            if (this.getAttribute('data-ev') === 'date') state.draft.events[i].eventDate = this.value;
            else state.draft.events[i].description = this.value;
          };
        }
        var dels = box.querySelectorAll('[data-ev-del]');
        for (var d = 0; d < dels.length; d++) {
          dels[d].onclick = function () {
            state.draft.events.splice(Number(this.getAttribute('data-ev-del')), 1);
            renderEvents();
          };
        }
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/"/g, '&quot;');
      }

      applyDeviceMode();
      if (WEB_APP_URL) {
        var lookupHero = document.getElementById('lookupHeroLink');
        if (lookupHero) lookupHero.href = WEB_APP_URL + '?page=lookup';
      }
      var officeBanner = document.getElementById('officeBanner');
      if (officeBanner) {
        officeBanner.classList.toggle('is-visible', !!state.directFromOffice);
      }
      window.addEventListener('resize', function () {
        var was = state.isMobile;
        applyDeviceMode();
        if (was !== state.isMobile) render();
      });
      render();

      } /* end customer wizard branch */
    </script>
  </body>
</html>
