  <meta property="og:site_name" content="Családi naptár" />
  <meta property="og:title" content="Családi naptár rendelés" />
  <meta property="og:description" content="Személyre szabott, nyomtatott 12 oldalas A4 naptár a saját fényképeiddel — 60 RON." />

  <style>
    :root { --ink: #2a241c; --muted: #6b6258; --accent: #b4532a; --card: #fffaf4; --line: #e4d8c8; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: linear-gradient(160deg, #f7f1e8, #efe4d6); color: var(--ink); }
    .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: 0 18px 50px rgba(80,50,20,.08); }
    .preview { display: block; width: 100%; height: auto; border-bottom: 1px solid var(--line); }
    .hero { background: linear-gradient(120deg, #3d2a1f, #8a3c1c 45%, #c47a3a); color: #fff8f1; padding: 28px 24px; }
    .hero h1 { margin: 0; font-size: 1.8rem; line-height: 1.2; }
    .hero p { margin: 10px 0 0; opacity: .92; }
    .body { padding: 22px 24px 28px; }
    .btn {
      display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
      padding: 14px 20px; border-radius: 12px; font-weight: 700; border: 0; font: inherit; cursor: pointer;
      width: 100%; text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="preview" src="og.jpg" alt="Családi naptár" />
      <div class="hero">
        <h1>Családi naptár rendelés</h1>
        <p>Személyre szabott, nyomtatott 12 oldalas A4 naptár a saját fényképeiddel.</p>
      </div>
      <div class="body">
        <button type="button" class="btn" id="openBtn">Megrendelés indítása</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var ORDER_URL = 'https://script.google.com/macros/s/AKfycbwx0WrFHBjckGTiAsfqPCZbgBfCyPQeT64Xv1cuoC7Tz-oc0RlEn-h6I6j0-hnrOSwa/exec';
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      // Facebook / Instagram / Line in-app browsers cannot load Apps Script.
      var isInAppBrowser =
        /FBAN|FBAV|FB_IAB|FBIOS|FB4A|Instagram|Line\//i.test(ua) ||
        (/\bwv\b/i.test(ua) && /Facebook/i.test(ua));
      // Keep this landing for social crawlers (OG preview).
      var isBot = /bot|crawl|spider|slurp|facebookexternalhit|meta-externalagent|whatsapp|telegram/i.test(ua);

      function androidChromeIntent(url) {
        var bare = url.replace(/^https?:\/\//i, '');
        return 'intent://' + bare + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
          encodeURIComponent(url) + ';end';
      }

      function openExternal() {
        if (isAndroid) {
          window.location.href = androidChromeIntent(ORDER_URL);
          return;
        }
        var w = window.open(ORDER_URL, '_blank', 'noopener');
        if (!w) window.location.href = ORDER_URL;
      }

      // Desktop / normal mobile browser: Apps Script can load → go straight there.
      if (!isInAppBrowser && !isBot) {
        window.location.replace(ORDER_URL);
        return;
      }

      document.getElementById('openBtn').onclick = function () {
        var ok = window.confirm(
          'A megrendeléshez külső böngésző kell (Chrome vagy Safari).\n\n' +
          'Megnyitja most külső böngészőben?'
        );
        if (!ok) return;
        openExternal();
      };
    })();
  </script>
</body>
</html>
