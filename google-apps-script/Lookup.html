<!DOCTYPE html>
<!-- Optional standalone copy. Production uses Customer.html (?page=lookup). -->
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      :root {
        --ink: #2a241c;
        --muted: #6b6258;
        --line: #e4d8c8;
        --accent: #b4532a;
        --card: #fffaf4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(160deg, #f7f1e8, #efe4d6 40%, #f8f3eb);
        color: var(--ink);
        min-height: 100vh;
      }
      main { max-width: 520px; margin: 0 auto; padding: 28px 16px 48px; }
      .hero {
        background: linear-gradient(120deg, #3d2a1f, #8a3c1c 45%, #c47a3a);
        color: #fff8f1;
        border-radius: 24px 24px 0 0;
        padding: 28px 24px;
      }
      .hero h1 { margin: 0; font-size: 1.6rem; }
      .hero p { margin: 10px 0 0; opacity: 0.9; }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-top: 0;
        border-radius: 0 0 24px 24px;
        padding: 22px;
        box-shadow: 0 18px 50px rgba(80, 50, 20, 0.08);
      }
      label { display: block; margin: 0 0 6px; font-weight: 600; }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        font: inherit;
        background: #fff;
      }
      .hint { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
        margin-top: 16px;
        background: var(--accent);
        color: #fff;
        width: 100%;
      }
      .btn:disabled { opacity: 0.55; cursor: default; }
      .error {
        display: none;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #fde8e4;
        color: #8a2a1c;
      }
      .links { margin-top: 18px; font-size: 0.9rem; }
      .links a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="hero">
        <h1>Rendelés keresése</h1>
        <p>Adja meg a rendelésszámot az áttekintő oldal megnyitásához.</p>
      </div>
      <div class="panel">
        <label for="orderId">Rendelésszám</label>
        <input id="orderId" placeholder="pl. ORD-2027-143052" autocomplete="off" />
        <div class="hint">A számot a megrendelés visszaigazolásán találja.</div>
        <button type="button" class="btn" id="openBtn">Áttekintés megnyitása</button>
        <div class="error" id="error"></div>
        <div class="links">
          <a id="newOrderLink" href="?page=customer">Új megrendelés</a>
        </div>
      </div>
    </main>
    <script>
      var WEB_APP_URL = <?!= JSON.stringify(webAppUrl || '') ?>;

      function showError(msg) {
        var el = document.getElementById('error');
        if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
        el.style.display = 'block';
        el.textContent = msg;
      }

      function reviewUrl(orderId) {
        var base = WEB_APP_URL || (location.href.split('?')[0]);
        return base + '?page=review&orderId=' + encodeURIComponent(orderId);
      }

      function openReview() {
        var orderId = (document.getElementById('orderId').value || '').trim();
        if (!orderId) {
          showError('Adja meg a rendelésszámot.');
          return;
        }
        showError('');
        var btn = document.getElementById('openBtn');
        btn.disabled = true;
        btn.textContent = 'Keresés…';

        google.script.run
          .withSuccessHandler(function () {
            window.top.location.href = reviewUrl(orderId);
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            btn.textContent = 'Áttekintés megnyitása';
            showError(err && err.message ? err.message : String(err));
          })
          .getOrderReviewByOrderId(orderId);
      }

      document.getElementById('openBtn').onclick = openReview;
      document.getElementById('orderId').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') openReview();
      });
      if (WEB_APP_URL) {
        document.getElementById('newOrderLink').href = WEB_APP_URL + '?page=customer';
      }
    </script>
  </body>
</html>
